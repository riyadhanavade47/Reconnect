<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find NGOs | ReConnect</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f5fff9;
            color: #173b32;
        }

        /* NAVBAR */

        nav {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #159957;
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #173b32;
            font-weight: bold;
        }

        nav a:hover {
            color: #159957;
        }

        /* HERO */

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(
                135deg,
                #d9fff0,
                #e4f4ff,
                #fff4d9
            );
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #159957;
        }

        .hero p {
            font-size: 19px;
            color: #607d75;
        }

        /* SEARCH */

        .search-section {
            padding: 40px 8% 20px;
            text-align: center;
        }

        .search-section h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 80%;
            max-width: 750px;
            padding: 16px 22px;
            border: 2px solid #d6e8df;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: #159957;
        }

        /* RESULT COUNT */

        #resultCount {
            margin-top: 18px;
            color: #607d75;
            font-weight: bold;
        }

        /* NGO GRID */

        .ngo-container {
            padding: 30px 8% 80px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* NGO CARD */

        .ngo-card {
            background: white;
            padding: 28px;
            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            transition: 0.3s;
        }

        .ngo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        }

        .ngo-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .ngo-card h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .ngo-card p {
            color: #607d75;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .verified {
            display: inline-block;

            padding: 6px 12px;

            background: #dff8e9;
            color: #159957;

            border-radius: 15px;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 12px;
        }

        /* BUTTON */

        .ngo-button {
            display: inline-block;

            margin-top: 12px;

            padding: 11px 20px;

            background: #159957;
            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;
        }

        .ngo-button:hover {
            background: #0b7a53;
        }

        /* NO RESULTS */

        #noResults {
            display: none;

            text-align: center;

            padding: 60px;

            font-size: 20px;

            color: #607d75;

            grid-column: 1 / -1;
        }

        /* LOADING */

        #loading {
            text-align: center;

            padding: 60px;

            font-size: 20px;

            color: #159957;

            grid-column: 1 / -1;
        }

        /* FOOTER */

        footer {
            background: #102d26;

            color: white;

            text-align: center;

            padding: 30px;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .ngo-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {

            .ngo-container {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 38px;
            }

            .search-box {
                width: 95%;
            }
        }
    </style>

</head>


<body>

    <!-- NAVIGATION -->

    <nav>

        <a href="index.html" class="logo">
            🌱 ReConnect
        </a>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="ngos.html">
                    Find NGOs
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About
                </a>
            </li>

            <li>
                <a href="index.html#volunteer">
                    Volunteer
                </a>
            </li>

        </ul>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Find <span>NGOs</span>
        </h1>

        <p>
            Discover organizations and find a cause you care about.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

        <h2>
            🔎 Search NGO Directory
        </h2>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by NGO name, location, cause or contact person..."
            onkeyup="searchNGOs()"
        >

        <p id="resultCount">
            Loading NGOs...
        </p>

    </section>


    <!-- NGO CARDS -->

    <section
        class="ngo-container"
        id="ngoContainer"
    >

        <div id="loading">
            🌱 Loading NGO directory...
        </div>

        <div id="noResults">
            😕 No NGOs found.
            <br><br>
            Try another search.
        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 ReConnect |
            Connect. Donate. Make a Difference. 🌱
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        let ngos = [];


        /*
        LOAD NGO DATA
        */

        fetch("ngos.json")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load NGO data.");
                }

                return response.json();

            })

            .then(data => {

                ngos = data;

                displayNGOs(ngos);

            })

            .catch(error => {

                console.error(error);

                document.getElementById("loading").innerHTML =
                    "⚠️ Unable to load NGO data.";

            });


        /*
        DISPLAY NGOs
        */

        function displayNGOs(data) {

            const container =
                document.getElementById("ngoContainer");

            const loading =
                document.getElementById("loading");

            const noResults =
                document.getElementById("noResults");

            loading.style.display = "none";

            /*
            Remove old NGO cards
            */

            document
                .querySelectorAll(".ngo-card")
                .forEach(card => card.remove());


            /*
            Show no results
            */

            if (data.length === 0) {

                noResults.style.display = "block";

            } else {

                noResults.style.display = "none";

            }


            /*
            Create NGO cards
            */

            data.forEach(ngo => {

                const card =
                    document.createElement("div");

                card.className = "ngo-card";


                /*
                Get values from dataset
                */

                const name =
                    ngo["Name of Institution"] || "NGO Name Not Available";

                const address =
                    ngo["Address"] || "Address not available";

                const contact =
                    ngo["Contact No."] || "Contact not available";

                const email =
                    ngo["Email ID"] || "Email not available";

                const work =
                    ngo["Area of Work"] || "Area of work not specified";

                const fcra =
                    ngo["FCRA"] || "Not specified";

                const bmc =
                    ngo["Working with BMC"] || "Not specified";


                /*
                NGO CARD
                */

                card.innerHTML = `

                    <div class="ngo-icon">
                        🌱
                    </div>

                    <h3>
                        ${name}
                    </h3>

                    <span class="verified">
                        ✓ NGO Directory
                    </span>

                    <p>
                        📍 ${address}
                    </p>

                    <p>
                        🏷️ <strong>Area of Work:</strong>
                        ${work}
                    </p>

                    <p>
                        📞 ${contact}
                    </p>

                    <p>
                        ✉️ ${email}
                    </p>

                    <p>
                        🏛️ <strong>BMC:</strong>
                        ${bmc}
                    </p>

                    <p>
                        📄 <strong>FCRA:</strong>
                        ${fcra}
                    </p>

                    <a
                        href="#"
                        class="ngo-button"
                        onclick="showNGODetails(event, ${JSON.stringify(ngo).replace(/"/g, '&quot;')})"
                    >
                        View Details
                    </a>

                `;


                container.appendChild(card);

            });


            /*
            Update count
            */

            document.getElementById("resultCount").innerText =
                `Showing ${data.length} of ${ngos.length} NGOs`;

        }


        /*
        SEARCH NGOs
        */

        function searchNGOs() {

            const searchText =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            if (searchText === "") {

                displayNGOs(ngos);

                return;

            }


            const filtered =
                ngos.filter(ngo => {

                    return Object
                        .values(ngo)
                        .join(" ")
                        .toLowerCase()
                        .includes(searchText);

                });


            displayNGOs(filtered);

        }


        /*
        VIEW NGO DETAILS
        */

        function showNGODetails(event, ngo) {

            event.preventDefault();


            const name =
                ngo["Name of Institution"] || "NGO";

            const address =
                ngo["Address"] || "Not available";

            const contact =
                ngo["Contact No."] || "Not available";

            const email =
                ngo["Email ID"] || "Not available";

            const work =
                ngo["Area of Work"] || "Not specified";

            const chairman =
                ngo["Chairman/CEO"] || "Not available";

            const person =
                ngo["Local Contact Person"] || "Not available";

            const since =
                ngo["Working Since"] || "Not available";

            const bmc =
                ngo["Working with BMC"] || "Not specified";

            const fcra =
                ngo["FCRA"] || "Not specified";

            const ward =
                ngo["Ward/Department"] || "Not specified";


            alert(

                "🌱 " + name +

                "\n\n" +

                "📍 Address: " +
                address +

                "\n\n" +

                "🏷️ Area of Work: " +
                work +

                "\n\n" +

                "👤 Chairman/CEO: " +
                chairman +

                "\n\n" +

                "👤 Contact Person: " +
                person +

                "\n\n" +

                "📞 Contact: " +
                contact +

                "\n\n" +

                "✉️ Email: " +
                email +

                "\n\n" +

                "📅 Working Since: " +
                since +

                "\n\n" +

                "🏛️ Working with BMC: " +
                bmc +

                "\n\n" +

                "📄 FCRA: " +
                fcra +

                "\n\n" +

                "🏢 Ward/Department: " +
                ward

            );

        }

    </script>

</body>

</html>
